# CLUE Verification Rules based on first character of license number

# Clean record - customer data correct as-is
clue.rule.clean.prefixes=1,4,7,A,B,C,D,E,F,G,H,I,J,K,L,M,N

# Minor discrepancy - add 1 accident
clue.rule.minor.prefixes=2,3,O,P,Q,R,S
clue.rule.minor.extra-accidents=1

# Moderate discrepancy - add 2 accidents + 1 violation
clue.rule.moderate.prefixes=5,8,T,U,V,W,X
clue.rule.moderate.extra-accidents=2
clue.rule.moderate.extra-violations=true

# High risk - add 3 accidents + force SR22
clue.rule.high-risk.prefixes=9,6,Y,Z
clue.rule.high-risk.extra-accidents=3
clue.rule.high-risk.sr22-override=true

# Suspended - override license status
clue.rule.suspended.prefixes=0
clue.rule.suspended.license-override=SUSPENDED